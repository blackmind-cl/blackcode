[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackcode"
version = "0.1.0"
description = "Motor open source de entrenamiento e inferencia de IA local, privado y sin telemetría."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "fine-tuning", "machine-learning", "local-ai", "privacy", "qlora"]
authors = [{ name = "Blackcode contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# El núcleo es deliberadamente ligero: solo PyYAML.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = [
    "torch>=2.1",
    "transformers>=4.46",
    "datasets>=2.18",
    "peft>=0.10",
    "trl>=0.19",
    "accelerate>=0.29",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
sklearn = ["scikit-learn>=1.3"]
embeddings = ["sentence-transformers>=3.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
onnx = ["optimum[onnxruntime]>=1.19"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
web = ["beautifulsoup4>=4.12"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pymssql>=2.3"]
oracle = ["oracledb>=2.0"]
notion = ["notion-client>=2.0"]
confluence = ["atlassian-python-api>=3.41"]
gdocs = ["google-api-python-client>=2.0", "google-auth>=2.0"]
ingest = ["blackcode[pdf]", "blackcode[docx]", "blackcode[web]", "blackcode[ocr]"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
    "blackcode[llm]",
    "blackcode[sklearn]",
    "blackcode[embeddings]",
    "blackcode[serve]",
    "blackcode[onnx]",
    "blackcode[ingest]",
    "blackcode[postgres]",
    "blackcode[mysql]",
    "blackcode[mssql]",
    "blackcode[oracle]",
    "blackcode[notion]",
    "blackcode[confluence]",
    "blackcode[gdocs]",
]

[project.urls]
Homepage = "https://blackmind.cl/blackcode"
Repository = "https://github.com/blackmind-cl/blackcode"
Issues = "https://github.com/blackmind-cl/blackcode/issues"
Changelog = "https://github.com/blackmind-cl/blackcode/blob/main/CHANGELOG.md"

[project.scripts]
blackcode = "blackcode.cli:main"

# Puntos de extensión para plugins de terceros:
# [project.entry-points."blackcode.trainers"]
# mi-trainer = "mi_paquete.modulo:MiTrainer"
# [project.entry-points."blackcode.exporters"]
# mi-exportador = "mi_paquete.modulo:MiExporter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
