name: Release

# Publica en PyPI al empujar un tag de versión (vX.Y.Z).
# Usa Trusted Publishing (OIDC): no hay tokens de PyPI guardados como secreto.
# Configúralo una vez en https://pypi.org/manage/account/publishing/ con:
#   proyecto: blackcode · owner: blackmind-cl · repo: blackcode
#   workflow: release.yml · environment: pypi

on:
  push:
    tags:
      - "v*"

jobs:
  # Antes de publicar, repetimos lint + tests para no liberar algo roto.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica que el tag coincide con la versión del paquete
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "El tag ($tag) no coincide con la versión de pyproject ($pkg)." >&2
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # requerido por Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
